[project]
name = "dnstester"
version = "0.1.0"
description = "Unbound DNS resolver scalability tester (load generator + unbound-control monitor + curses DNS quality poller with SQLite failure logging and CSV/XLSX export)"
requires-python = ">=3.14"
dependencies = [
    # The poller/exporter are pure stdlib (the SSH monitor shells out to the
    # system `ssh`); streamlit + pandas drive `streamlit run dashboard.py`.
    "streamlit>=1.40",
    "pandas>=2.0",
]

[project.scripts]
dnstester = "dnstester.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dnstester"]
